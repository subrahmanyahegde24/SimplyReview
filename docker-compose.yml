# Local development databases. Production uses Qdrant Cloud and Neo4j Aura.
# Qdrant runs only with `docker compose --profile local-qdrant up -d` (dev uses Qdrant Cloud by default).
services:
  neo4j:
    image: neo4j:5-community
    ports: ["7474:7474", "7687:7687"]
    environment:
      NEO4J_AUTH: neo4j/simplyreview-dev
    volumes: ["neo4j_data:/data"]

  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["local-qdrant"]
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrant_data:/qdrant/storage"]

volumes:
  qdrant_data:
  neo4j_data:
