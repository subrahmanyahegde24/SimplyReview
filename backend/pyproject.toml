[project]
name = "simplyreview"
version = "0.1.0"
description = "SimplyReview: hybrid vector + graph RAG research copilot"
authors = [
    { name = "Subrahmanya Shivaram Hegde", email = "subrahmanyashegde24@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.147.0",
    "google-genai>=2.31.0",
    "neo4j>=6.4.1",
    "pydantic>=2.14.1",
    "pymupdf>=2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
